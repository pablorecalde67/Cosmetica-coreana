name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  HEROKU_APP_NAME: kbeautycde

jobs:
  deploy-heroku:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Deploy to Heroku via git push
        run: |
          # Set up Heroku credentials
          mkdir -p ~/.netrc
          echo "machine api.heroku.com" > ~/.netrc
          echo "  login placeholder" >> ~/.netrc
          echo "  password $HEROKU_API_KEY" >> ~/.netrc
          chmod 600 ~/.netrc

          # Configure git
          git config user.email "ci@heroku.com"
          git config user.name "GitHub Actions"

          # Add Heroku remote
          git remote add heroku https://git.heroku.com/${{ env.HEROKU_APP_NAME }}.git

          # Deploy the automation-coca subdirectory
          git push heroku `git subtree split --prefix automation-coca main`:main -f 2>&1 | tee deploy.log

          echo "✅ Deployment initiated to Heroku"
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}

      - name: Wait for Heroku deployment
        run: sleep 20

      - name: Health check
        run: |
          for i in {1..10}; do
            echo "Health check attempt $i/10..."
            if curl -s -f https://${{ env.HEROKU_APP_NAME }}.herokuapp.com/api/admin/health > /dev/null 2>&1; then
              echo "✅ App is live!"
              echo ""
              echo "🎉 Deployment Successful!"
              echo "🌐 App URL: https://${{ env.HEROKU_APP_NAME }}.herokuapp.com"
              echo "📊 Admin: https://${{ env.HEROKU_APP_NAME }}.herokuapp.com/admin.html"
              exit 0
            fi
            echo "⏳ App still starting..."
            sleep 3
          done
          echo "⚠️  App might still be initializing"
          exit 0
