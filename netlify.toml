[build]
  publish = "automation-coca/public"
  functions = "functions"
  command = "echo 'Build complete'"

[[redirects]]
from = "/test"
to = "/.netlify/functions/test"
status = 200

[[redirects]]
from = "/api/tiendas"
to = "/.netlify/functions/tiendas-api"
status = 200

[[redirects]]
from = "/api/tiendas/:id"
to = "/.netlify/functions/tiendas-api"
status = 200
