<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Define gradients -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b8818b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a68a8a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="150" cy="150" r="148" fill="white" stroke="#b8818b" stroke-width="2"/>

  <!-- Decorative top element - Flower petal shape -->
  <g id="petal" filter="url(#glow)">
    <path d="M 150 50 Q 130 80 140 110 Q 150 120 160 110 Q 170 80 150 50" fill="url(#logoGradient)" opacity="0.8"/>
  </g>

  <!-- Mirror petal -->
  <g transform="rotate(120 150 150)">
    <path d="M 150 50 Q 130 80 140 110 Q 150 120 160 110 Q 170 80 150 50" fill="url(#logoGradient)" opacity="0.8"/>
  </g>

  <g transform="rotate(240 150 150)">
    <path d="M 150 50 Q 130 80 140 110 Q 150 120 160 110 Q 170 80 150 50" fill="url(#logoGradient)" opacity="0.8"/>
  </g>

  <!-- Center circle -->
  <circle cx="150" cy="150" r="35" fill="url(#logoGradient)"/>

  <!-- Inner decorative circle -->
  <circle cx="150" cy="150" r="30" fill="none" stroke="white" stroke-width="1.5" opacity="0.6"/>

  <!-- Korean text for "Beauty" - 미 (Mi) -->
  <text x="150" y="160" font-family="'Noto Sans CJK KR', sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle" dy="0.3em">미</text>

  <!-- Bottom text: K-BEAUTY -->
  <text x="150" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#b8818b" text-anchor="middle" letter-spacing="2">K-BEAUTY</text>

  <!-- Bottom accent line -->
  <line x1="90" y1="235" x2="210" y2="235" stroke="#b8818b" stroke-width="1.5" opacity="0.5"/>

  <!-- City text: CDE -->
  <text x="150" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#a68a8a" text-anchor="middle" letter-spacing="1">CIUDAD DEL ESTE</text>
</svg>
