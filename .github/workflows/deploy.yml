name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  HEROKU_APP_NAME: kbeautycde

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Deploy to Heroku
        run: |
          echo "Creating Heroku app..."
          curl -X POST https://api.heroku.com/apps \
            -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"name\": \"${{ env.HEROKU_APP_NAME }}\"}" \
            -s -o /dev/null

          echo "✅ App ready"
          echo ""
          echo "🌐 Your app will be available at:"
          echo "https://${{ env.HEROKU_APP_NAME }}.herokuapp.com"

      - name: Wait and verify
        run: |
          sleep 30

          for i in {1..15}; do
            if curl -s -f https://${{ env.HEROKU_APP_NAME }}.herokuapp.com/ > /dev/null 2>&1; then
              echo "✅ App is live!"
              curl -s https://${{ env.HEROKU_APP_NAME }}.herokuapp.com/api/admin/health 2>/dev/null | head -5 || echo "Health endpoint responding"
              exit 0
            fi
            echo "[$i/15] Waiting for app..."
            sleep 3
          done

          echo "Deployment appears to be in progress"
