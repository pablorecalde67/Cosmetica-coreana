<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K-Beauty CDE · 20 Tiendas de Cosmética Coreana</title>
  <style>
    :root {
      color-scheme: light;
      --primary: #b8818b;
      --secondary: #d4a5a5;
      --accent: #a68a8a;
      --light-bg: #f5f1f0;
      --dark-text: #3a3a3a;
      --light-text: #666;
      --border: #e8e1df;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff;
      color: var(--dark-text);
      line-height: 1.6;
    }
    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 28px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    header h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--primary);
    }
    header .subtitle {
      margin: 0;
      font-size: 0.9rem;
      color: var(--light-text);
    }
    header p {
      font-size: 0.9rem;
      color: var(--light-text);
      margin: 0 0 12px 0;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: white;
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      transition: border-color 0.2s;
    }
    .stat-card:hover {
      border-color: var(--primary);
    }
    .stat-card .number {
      font-size: 2.5rem;
      font-weight: bold;
      color: var(--primary);
    }
    .stat-card .label {
      color: var(--light-text);
      margin-top: 5px;
      font-size: 0.95rem;
    }
    .tiendas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 25px;
    }
    .tienda-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .tienda-card:hover {
      border-color: var(--primary);
    }
    .tienda-header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      color: var(--dark-text);
      padding: 20px;
    }
    .tienda-header h3 {
      font-size: 1.3rem;
      margin-bottom: 8px;
      color: var(--primary);
      font-weight: 600;
    }
    .categoria {
      display: inline-block;
      background: var(--light-bg);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .tienda-body {
      padding: 20px;
    }
    .rating {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 15px;
      font-weight: 600;
    }
    .stars {
      color: #ffc107;
    }
    .info-row {
      margin-bottom: 12px;
      font-size: 0.95rem;
    }
    .info-label {
      font-weight: 600;
      color: var(--primary);
      display: block;
      margin-bottom: 3px;
    }
    .info-value {
      color: var(--dark-text);
      word-break: break-word;
    }
    .info-value a {
      color: var(--primary);
      text-decoration: none;
      transition: color 0.2s;
    }
    .info-value a:hover {
      color: var(--accent);
    }
    .productos {
      background: var(--light-bg);
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
    }
    .productos strong {
      color: var(--primary);
    }
    .productos-list {
      list-style: none;
      font-size: 0.9rem;
    }
    .productos-list li {
      padding: 4px 0;
      color: #666;
    }
    .productos-list li:before {
      content: "• ";
      color: var(--primary);
      font-weight: bold;
      margin-right: 6px;
    }
    .productos-list li {
      color: var(--dark-text);
    }
    .contact {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    .contact a {
      flex: 1;
      min-width: 130px;
      padding: 8px 12px;
      text-align: center;
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: 0.2s;
      border: 1px solid transparent;
    }
    .whatsapp {
      background: #25d366;
      color: white;
    }
    .whatsapp:hover {
      background: #1ea952;
    }
    .email {
      background: var(--primary);
      color: white;
    }
    .email:hover {
      background: var(--accent);
    }
    .loading {
      text-align: center;
      padding: 60px 20px;
      font-size: 1.2rem;
      color: #666;
    }
    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid var(--light-bg);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .error {
      background: #fef0f0;
      border: 1px solid #e8d5d5;
      color: #c33;
      padding: 20px;
      border-radius: 8px;
      margin: 20px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <svg width="40" height="40" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
        <circle cx="150" cy="150" r="148" fill="white" stroke="#b8818b" stroke-width="2"/>
        <g opacity="0.8"><path d="M 150 50 Q 130 80 140 110 Q 150 120 160 110 Q 170 80 150 50" fill="#b8818b"/></g>
        <g transform="rotate(120 150 150)" opacity="0.8"><path d="M 150 50 Q 130 80 140 110 Q 150 120 160 110 Q 170 80 150 50" fill="#b8818b"/></g>
        <g transform="rotate(240 150 150)" opacity="0.8"><path d="M 150 50 Q 130 80 140 110 Q 150 120 160 110 Q 170 80 150 50" fill="#b8818b"/></g>
        <circle cx="150" cy="150" r="35" fill="#b8818b"/>
        <circle cx="150" cy="150" r="30" fill="none" stroke="white" stroke-width="1.5" opacity="0.6"/>
        <text x="150" y="160" font-family="Arial" font-size="36" font-weight="bold" fill="white" text-anchor="middle" dy="0.3em">미</text>
      </svg>
      <div>
        <h1>K-Beauty CDE</h1>
        <p class="subtitle">Tiendas de cosmética coreana</p>
      </div>
    </div>
    <p>Las mejores tiendas de cosmética coreana en Ciudad del Este</p>
  </header>

  <div class="container">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Cargando tiendas...</p>
    </div>

    <div id="error" class="error" style="display:none;"></div>

    <div id="content" style="display:none;">
      <div class="stats">
        <div class="stat-card">
          <div class="number" id="total-tiendas">20</div>
          <div class="label">Tiendas activas</div>
        </div>
        <div class="stat-card">
          <div class="number" id="avg-rating">4.7</div>
          <div class="label">Calificación promedio</div>
        </div>
        <div class="stat-card">
          <div class="number">Ciudad del Este</div>
          <div class="label">Ubicación</div>
        </div>
      </div>

      <div class="tiendas-grid" id="tiendas-grid"></div>
    </div>
  </div>

  <script>
    async function cargarTiendas() {
      try {
        const res = await fetch('/api-tiendas');
        if (!res.ok) throw new Error(`Error ${res.status}: ${res.statusText}`);

        const response = await res.json();
        if (!response.success) throw new Error('Respuesta inválida del servidor');

        const tiendas = response.data;

        // Calcular promedio de calificación
        const avgRating = (tiendas.reduce((sum, t) => sum + t.calificacion, 0) / tiendas.length).toFixed(1);
        document.getElementById('avg-rating').textContent = avgRating;

        // Renderizar tiendas
        const grid = document.getElementById('tiendas-grid');
        grid.innerHTML = tiendas.map(tienda => `
          <div class="tienda-card">
            <div class="tienda-header">
              <h3>${tienda.nombre}</h3>
              <span class="categoria">${tienda.categoria}</span>
            </div>
            <div class="tienda-body">
              <div class="rating">
                <span class="stars">${'⭐'.repeat(Math.round(tienda.calificacion))}</span>
                <span>${tienda.calificacion}/5</span>
              </div>

              <div class="info-row">
                <span class="info-label">📍 Ubicación</span>
                <span class="info-value">${tienda.ubicacion}</span>
              </div>

              <div class="info-row">
                <span class="info-label">🌐 Sitio web</span>
                <span class="info-value"><a href="${tienda.sitio_web}" target="_blank">${tienda.sitio_web}</a></span>
              </div>

              <div class="productos">
                <strong style="color: #667eea;">Productos destacados:</strong>
                <ul class="productos-list">
                  ${tienda.productos.map(p => `<li>${p}</li>`).join('')}
                </ul>
              </div>

              <div class="contact">
                <a href="https://wa.me/+595${tienda.telefono.replace(/^\+595\s?/, '')}" class="whatsapp" target="_blank">
                  WhatsApp
                </a>
                <a href="mailto:${tienda.email}" class="email">
                  Email
                </a>
              </div>
            </div>
          </div>
        `).join('');

        // Mostrar contenido, ocultar loading
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

      } catch (error) {
        console.error('Error:', error);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').innerHTML = `
          <strong>⚠️ Error al cargar tiendas</strong><br>
          ${error.message}
        `;
      }
    }

    // Cargar tiendas cuando la página cargue
    document.addEventListener('DOMContentLoaded', cargarTiendas);
  </script>
</body>
</html>
