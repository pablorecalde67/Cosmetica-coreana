name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  HEROKU_APP_NAME: kbeautycde

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image
        working-directory: automation-coca
        run: |
          docker build -t ${{ env.HEROKU_APP_NAME }}:latest .

      - name: Login to Heroku Container Registry
        run: |
          echo ${{ secrets.HEROKU_API_KEY }} | docker login --username=_ --password-stdin registry.heroku.com

      - name: Create Heroku app if needed
        run: |
          curl -X POST https://api.heroku.com/apps \
            -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"name\": \"${{ env.HEROKU_APP_NAME }}\"}" \
            -s -o /dev/null

          echo "App ready"

      - name: Push Docker image to Heroku
        run: |
          docker tag ${{ env.HEROKU_APP_NAME }}:latest registry.heroku.com/${{ env.HEROKU_APP_NAME }}/web:latest
          docker push registry.heroku.com/${{ env.HEROKU_APP_NAME }}/web:latest

      - name: Release on Heroku
        run: |
          # Get image ID
          IMAGE_ID=$(curl -s https://api.heroku.com/apps/${{ env.HEROKU_APP_NAME }}/formation \
            -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
            -H "Accept: application/vnd.heroku+json; version=3.docker-releases" | grep -o '"image_id":"[^"]*' | cut -d'"' -f4 | head -1)

          if [ ! -z "$IMAGE_ID" ]; then
            echo "Releasing image: $IMAGE_ID"
            curl -X PATCH https://api.heroku.com/apps/${{ env.HEROKU_APP_NAME }}/formation \
              -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
              -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
              -H "Content-Type: application/json" \
              -d "[{\"type\": \"web\", \"docker_image\": \"$IMAGE_ID\"}]"
          fi

      - name: Wait and verify
        run: |
          sleep 20

          for i in {1..12}; do
            if curl -s -f https://${{ env.HEROKU_APP_NAME }}.herokuapp.com/ > /dev/null 2>&1; then
              echo "✅ App is running!"
              curl -s https://${{ env.HEROKU_APP_NAME }}.herokuapp.com/api/admin/health || echo "Health check endpoint"
              exit 0
            fi
            echo "Attempt $i/12..."
            sleep 5
          done
