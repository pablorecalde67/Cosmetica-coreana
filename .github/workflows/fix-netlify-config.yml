name: 🔧 Fix Netlify Configuration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener información de Netlify
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}" \
            https://api.netlify.com/api/v1/sites/serene-axolotl-437b9f \
            -o /tmp/site.json
          
          echo "=== Información del Sitio ==="
          jq '.name, .url, .ssl_url, .account_slug' /tmp/site.json
      
      - name: Desactivar builds automáticos
        run: |
          curl -X PATCH \
            -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"auto_deploy": false}' \
            https://api.netlify.com/api/v1/sites/serene-axolotl-437b9f \
            -o /tmp/update.json
          
          jq '.auto_deploy' /tmp/update.json
          echo "✅ Auto-deploy desactivado"
      
      - name: Verificar despliegues recientes
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}" \
            "https://api.netlify.com/api/v1/sites/serene-axolotl-437b9f/deploys?limit=5" \
            | jq '.[] | {state: .state, branch: .branch, created_at: .created_at, error_message: .error_message}' | head -40

  deploy:
    runs-on: ubuntu-latest
    needs: configure
    steps:
      - uses: actions/checkout@v4
      
      - name: Empaquetar sitio (producción)
        run: |
          cd docs
          zip -r ../deploy.zip . -x "*.md"
          cd ..
          echo "Tamaño: $(du -h deploy.zip | cut -f1)"
      
      - name: Limpiar despliegues previos en Netlify
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}" \
            https://api.netlify.com/api/v1/sites/serene-axolotl-437b9f/deploys \
            | jq -r '.[0].id' > /tmp/deploy_id.txt
          
          DEPLOY_ID=$(cat /tmp/deploy_id.txt)
          echo "Último deploy: $DEPLOY_ID"
      
      - name: Desplegar a Netlify (producción)
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary @deploy.zip \
            https://api.netlify.com/api/v1/sites/serene-axolotl-437b9f/deploys \
            -o /tmp/deploy_result.json
          
          echo "=== Resultado del Despliegue ==="
          jq '.state, .url, .deploy_id, .error_message' /tmp/deploy_result.json
          
          STATE=$(jq -r '.state' /tmp/deploy_result.json)
          if [ "$STATE" = "ready" ] || [ "$STATE" = "queued" ]; then
            echo "✅ Despliegue exitoso"
          else
            echo "❌ Error en despliegue: $STATE"
            jq '.' /tmp/deploy_result.json
            exit 1
          fi
      
      - name: Verificar contenido en kbeautycde.com
        run: |
          sleep 5
          echo "Verificando kbeautycde.com..."
          curl -s -I https://kbeautycde.com | head -10
          
          echo ""
          echo "Buscando 'tienda' en la página..."
          curl -s https://kbeautycde.com | grep -i "k-beauty\|tienda\|productos" | head -5 || echo "⚠️ Palabras clave no encontradas"
