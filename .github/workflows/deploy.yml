name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  HEROKU_APP_NAME: kbeautycde
  NODE_VERSION: '18'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh

      - name: Create Heroku app
        run: |
          export PATH="/usr/local/bin:$PATH"
          heroku auth:login --browser=false <<< "${{ secrets.HEROKU_API_KEY }}"

          heroku create ${{ env.HEROKU_APP_NAME }} --region us || echo "App may already exist"
          heroku apps:info -a ${{ env.HEROKU_APP_NAME }}
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}

      - name: Deploy
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd automation-coca

          # Initialize git if needed
          git config user.email "ci@heroku.com" || git init && git config user.email "ci@heroku.com"
          git config user.name "CI"

          # Add all files
          git add -A
          git commit -m "Deployment from GitHub Actions" || echo "Nothing to commit"

          # Deploy via Heroku CLI
          heroku git:clone -a ${{ env.HEROKU_APP_NAME }} ../heroku-app 2>/dev/null || true

          # Copy files to heroku-app and push
          cp -r . ../heroku-app/ 2>/dev/null || true
          cd ../heroku-app
          git add -A
          git commit -m "Deploy $(date)" || echo "Nothing to commit"

          git push heroku main -f || git push heroku HEAD:main -f
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}

      - name: Health check
        run: |
          sleep 20
          for i in {1..12}; do
            echo "Health check $i/12..."
            if curl -s -f https://${{ env.HEROKU_APP_NAME }}.herokuapp.com/ > /dev/null 2>&1; then
              echo "✅ App is up!"
              curl -s https://${{ env.HEROKU_APP_NAME }}.herokuapp.com/api/admin/health 2>/dev/null | head -5 || echo "App responding"
              echo ""
              echo "SUCCESS: https://${{ env.HEROKU_APP_NAME }}.herokuapp.com"
              exit 0
            fi
            sleep 3
          done
          echo "App may still be starting"
