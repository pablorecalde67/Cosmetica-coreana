name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  HEROKU_APP_NAME: kbeautycde

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Heroku CLI
        run: |
          npm install -g heroku

      - name: Deploy to Heroku
        run: |
          # Create Heroku auth config
          mkdir -p ~/.config/heroku
          echo "oauth = ${{ secrets.HEROKU_API_KEY }}" > ~/.config/heroku/config.json

          # Navigate to app directory
          cd automation-coca

          # Check if app exists
          heroku apps --json | grep -q "kbeautycde" || heroku create kbeautycde

          # Git config for Heroku
          git config user.email "bot@github.com"
          git config user.name "GitHub Actions Bot"

          # Add Heroku remote
          heroku git:remote -a ${{ env.HEROKU_APP_NAME }} || true

          # Deploy
          git push heroku main -f
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}

      - name: Verify Deployment
        run: |
          sleep 20
          for i in {1..15}; do
            echo "Health check $i/15..."
            if curl -s -f "https://${{ env.HEROKU_APP_NAME }}.herokuapp.com/api/admin/health" > /dev/null 2>&1; then
              echo ""
              echo "✅✅✅ DEPLOYMENT SUCCESSFUL ✅✅✅"
              echo ""
              echo "🌐 App URL: https://${{ env.HEROKU_APP_NAME }}.herokuapp.com"
              exit 0
            fi
            sleep 3
          done
          echo "Deployment initiated (may take additional time to fully start)"
