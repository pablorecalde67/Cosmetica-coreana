<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-Beauty CDE Shop - Catálogo Completo</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://sdk.mercadopago.com/js/v2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-pink: #e8b4a8;
      --accent-dark: #c89080;
      --text-dark: #2c2c2c;
      --bg-light: #fffaf7;
      --bg-card: #faf6f3;
      --border-color: #e8d5c8;
      --success: #4caf50;
      --warning: #ff9800;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg-light);
      color: var(--text-dark);
      line-height: 1.6;
    }

    /* HEADER */
    header {
      background: white;
      padding: 15px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-img {
      width: 40px;
      height: 40px;
    }

    .header-title {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      color: var(--accent-dark);
      flex: 1;
      text-align: center;
    }

    .cart-btn {
      background: var(--accent-dark);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      position: relative;
      transition: all 0.3s ease;
    }

    .cart-btn:hover {
      background: var(--primary-pink);
      transform: scale(1.05);
    }

    .cart-count {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #ff6b6b;
      color: white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }

    /* FILTERS & SEARCH */
    .controls {
      background: white;
      padding: 15px;
      margin: 10px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      padding: 10px 15px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Montserrat', sans-serif;
    }

    .search-box:focus {
      outline: none;
      border-color: var(--accent-dark);
      box-shadow: 0 0 8px rgba(200, 144, 128, 0.2);
    }

    .filter-btn {
      padding: 8px 14px;
      border: 1px solid var(--border-color);
      background: white;
      color: var(--text-dark);
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: var(--accent-dark);
      color: white;
      border-color: var(--accent-dark);
    }

    /* CONTAINER & GRID */
    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 10px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .product-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 8px 20px rgba(200, 144, 128, 0.2);
    }

    .product-image {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #fffaf7 0%, #f9f5f1 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 10px;
    }

    .product-image img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      border-radius: 12px;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
    }

    .product-info {
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .product-brand {
      font-size: 11px;
      color: var(--accent-dark);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .product-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 6px;
      line-height: 1.4;
      flex: 1;
    }

    .product-rating {
      font-size: 11px;
      color: #e8a55c;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .product-prices {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      font-weight: 600;
      font-size: 12px;
    }

    .price-usd {
      color: var(--accent-dark);
    }

    .price-ars {
      color: #999;
      font-size: 11px;
    }

    .add-to-cart-btn {
      background: var(--accent-dark);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      margin-top: auto;
    }

    .add-to-cart-btn:hover {
      background: var(--primary-pink);
      transform: scale(1.02);
    }

    .add-to-cart-btn.in-cart {
      background: var(--success);
      opacity: 0.9;
    }

    .no-products {
      text-align: center;
      padding: 60px 20px;
      color: var(--accent-dark);
      font-size: 18px;
    }

    /* CART MODAL */
    .cart-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 200;
      overflow-y: auto;
      animation: fadeIn 0.3s ease;
    }

    .cart-modal.active {
      display: flex;
      align-items: flex-end;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .cart-content {
      background: white;
      width: 100%;
      max-width: 500px;
      margin-left: auto;
      border-radius: 20px 20px 0 0;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.1);
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      border-bottom: 2px solid var(--border-color);
      position: sticky;
      top: 0;
      background: white;
    }

    .cart-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: var(--accent-dark);
    }

    .close-cart {
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
      color: var(--accent-dark);
    }

    .cart-items {
      padding: 15px;
      max-height: 350px;
      overflow-y: auto;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: var(--bg-card);
      border-radius: 8px;
      margin-bottom: 10px;
      gap: 10px;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 4px;
    }

    .cart-item-price {
      font-size: 12px;
      color: var(--accent-dark);
      font-weight: 600;
    }

    .cart-item-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .qty-btn {
      background: white;
      border: 1px solid var(--border-color);
      width: 28px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      color: var(--accent-dark);
      transition: all 0.2s ease;
    }

    .qty-btn:hover {
      background: var(--accent-dark);
      color: white;
    }

    .qty-display {
      min-width: 30px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
    }

    .remove-btn {
      background: #ff6b6b;
      color: white;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .remove-btn:hover {
      background: #ff5252;
    }

    /* SHIPPING SECTION */
    .shipping-section {
      padding: 15px;
      background: var(--bg-card);
      border-radius: 8px;
      margin-bottom: 15px;
      border: 2px solid var(--border-color);
    }

    .shipping-section h3 {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-dark);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .province-select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 13px;
      font-family: 'Montserrat', sans-serif;
      margin-bottom: 10px;
      color: var(--text-dark);
    }

    .province-select:focus {
      outline: none;
      border-color: var(--accent-dark);
      box-shadow: 0 0 8px rgba(200, 144, 128, 0.2);
    }

    .shipping-info {
      font-size: 12px;
      background: white;
      padding: 10px;
      border-radius: 6px;
      line-height: 1.5;
    }

    .shipping-cost {
      font-weight: 700;
      color: var(--accent-dark);
      margin: 8px 0 0 0;
    }

    /* PAYMENT METHOD SECTION */
    .payment-section {
      padding: 15px;
      background: var(--bg-card);
      border-radius: 8px;
      margin-bottom: 15px;
      border: 2px solid var(--border-color);
    }

    .payment-section h3 {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-dark);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .payment-options {
      display: flex;
      gap: 10px;
    }

    .payment-option {
      flex: 1;
      padding: 10px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      background: white;
      cursor: pointer;
      text-align: center;
      font-weight: 600;
      font-size: 12px;
      transition: all 0.3s ease;
      color: var(--text-dark);
    }

    .payment-option:hover {
      border-color: var(--accent-dark);
      background: var(--bg-light);
    }

    .payment-option.active {
      border-color: var(--accent-dark);
      background: var(--accent-dark);
      color: white;
    }

    /* CART SUMMARY */
    .cart-summary {
      padding: 15px;
      background: white;
      border-top: 2px solid var(--border-color);
      border-bottom: 2px solid var(--border-color);
      margin-bottom: 15px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .summary-row.total {
      font-weight: 700;
      font-size: 15px;
      color: var(--accent-dark);
      padding-top: 10px;
      margin-top: 10px;
      border-top: 2px solid var(--border-color);
    }

    /* CHECKOUT BUTTONS */
    .checkout-buttons {
      display: flex;
      gap: 10px;
      padding: 15px;
      flex-direction: column;
    }

    .checkout-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent-dark);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .checkout-btn:hover:not(:disabled) {
      background: var(--primary-pink);
      transform: scale(1.02);
    }

    .checkout-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .checkout-btn.secondary {
      background: #888;
    }

    .checkout-btn.secondary:hover {
      background: #666;
    }

    .empty-cart {
      text-align: center;
      padding: 40px 20px;
      color: var(--accent-dark);
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .products-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
      }

      .controls {
        flex-direction: column;
      }

      .search-box {
        min-width: 100%;
      }

      .header-title {
        font-size: 16px;
      }

      .cart-content {
        max-width: 100%;
      }
    }

    @media (max-width: 480px) {
      .products-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .cart-content {
        max-width: 100%;
      }

      .product-image {
        height: 140px;
      }

      .product-name {
        font-size: 11px;
      }

      .payment-options {
        flex-direction: column;
      }
    }

    /* MERCADO PAGO CUSTOMIZATION */
    .walletmp-container {
      margin: 15px 0;
    }

    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(200, 144, 128, 0.3);
      border-top-color: var(--accent-dark);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .mp-error {
      background: #ffebee;
      color: #c62828;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header>
    <img src="./logo.svg" alt="K-Beauty CDE" class="logo-img">
    <h1 class="header-title">K-BEAUTY SHOP</h1>
    <button class="cart-btn" id="cartBtn">
      CARRITO
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </header>

  <div class="container">
    <!-- SEARCH & FILTERS -->
    <div class="controls">
      <input type="text" id="searchInput" class="search-box" placeholder="Buscar producto...">
      <button class="filter-btn active" data-filter="all">TODOS</button>
      <button class="filter-btn" data-filter="serum">SERUMS</button>
      <button class="filter-btn" data-filter="toner">TÓNICOS</button>
      <button class="filter-btn" data-filter="cream">CREMAS</button>
      <button class="filter-btn" data-filter="cleanser">LIMPIADORAS</button>
      <button class="filter-btn" data-filter="sunscreen">PROTECTORES</button>
      <button class="filter-btn" data-filter="ampoule">AMPOLLAS</button>
    </div>

    <!-- PRODUCTS GRID -->
    <div class="products-grid" id="productsGrid"></div>
    <div class="no-products" id="noProducts" style="display: none;">
      No se encontraron productos
    </div>
  </div>

  <!-- CART MODAL -->
  <div class="cart-modal" id="cartModal">
    <div class="cart-content">
      <div class="cart-header">
        <h2>Mi Carrito</h2>
        <button class="close-cart" id="closeCart">&times;</button>
      </div>

      <div class="cart-items" id="cartItems"></div>

      <!-- SHIPPING SECTION -->
      <div class="shipping-section" id="shippingSection" style="display: none;">
        <h3>Envío a Domicilio</h3>
        <select class="province-select" id="provinceSelect">
          <option value="">Selecciona tu provincia...</option>
        </select>
        <div class="shipping-info" id="shippingInfo" style="display: none;">
          <span id="shippingDays"></span>
          <div class="shipping-cost">Envío: <span id="shippingCost">$0</span></div>
        </div>
      </div>

      <!-- PAYMENT METHOD SECTION -->
      <div class="payment-section" id="paymentSection" style="display: none;">
        <h3>Método de Pago</h3>
        <div class="payment-options">
          <button class="payment-option active" data-method="whatsapp">
            📱 WhatsApp
          </button>
          <button class="payment-option" data-method="mercadopago">
            💳 Mercado Pago
          </button>
        </div>
      </div>

      <!-- MERCADO PAGO CONTAINER -->
      <div id="mercadoPagoContainer" style="display: none; padding: 15px; background: var(--bg-card); border-radius: 8px; margin-bottom: 15px;">
        <div id="walletmp"></div>
        <div id="mpError" class="mp-error" style="display: none;"></div>
      </div>

      <!-- CART SUMMARY -->
      <div class="cart-summary">
        <div class="summary-row">
          <span>Subtotal USD:</span>
          <span id="subtotalUSD">u$s 0</span>
        </div>
        <div class="summary-row">
          <span>Subtotal ARS:</span>
          <span id="subtotalARS">$0</span>
        </div>
        <div class="summary-row" id="shippingRow" style="display: none;">
          <span>Envío:</span>
          <span id="shippingDisplay">$0</span>
        </div>
        <div class="summary-row total">
          <span>Total:</span>
          <span id="totalUSD">u$s 0</span>
        </div>
      </div>

      <!-- CHECKOUT BUTTONS -->
      <div class="checkout-buttons">
        <button class="checkout-btn" id="checkoutBtn">COMPRAR POR WHATSAPP</button>
        <button class="checkout-btn secondary" id="mercadoPagoBtn" style="display: none;">PAGAR CON MERCADO PAGO</button>
      </div>
    </div>
  </div>

  <script src="./config.js"></script>
  <script src="./analytics.js"></script>
  <script src="./mercado-pago.js"></script>
  <script>
    const ARS_RATE = 1050;
    let products = [];
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let currentFilter = 'all';
    let shippingZones = [];
    let selectedProvince = null;
    let shippingCost = 0;
    let paymentMethod = 'whatsapp';
    let mp = null;
    let preferenceId = null;

    // LOAD DATA
    async function loadData() {
      try {
        const [productsRes, zonesRes] = await Promise.all([
          fetch('./data/products.json'),
          fetch('./data/andreani-zones.json')
        ]);

        products = await productsRes.json();
        const zonesData = await zonesRes.json();
        shippingZones = zonesData.zones;

        analytics.trackPageView('Shop - Catálogo Completo');
        initializeProvinceSelect();
        renderProducts();
        updateCartCount();
        initializeMercadoPago();
      } catch (error) {
        console.error('Error loading data:', error);
        document.getElementById('noProducts').style.display = 'block';
      }
    }

    // MERCADO PAGO INITIALIZATION
    function initializeMercadoPago() {
      const publicKey = config.mercadoPago?.publicKey || 'APP_USR-d12345678901234567890abcd';
      if (publicKey && window.MercadoPago) {
        mp = new window.MercadoPago(publicKey);
        console.log('✅ Mercado Pago initialized');
      }
    }

    // INITIALIZE PROVINCE SELECT
    function initializeProvinceSelect() {
      const select = document.getElementById('provinceSelect');
      const provinces = [...new Set(shippingZones.map(z => z.provincia))];

      provinces.forEach(provincia => {
        const option = document.createElement('option');
        option.value = provincia;
        option.textContent = provincia;
        select.appendChild(option);
      });

      select.addEventListener('change', function() {
        selectedProvince = this.value;
        updateShippingCost();
        updateCartModal();
      });
    }

    // UPDATE SHIPPING COST
    function updateShippingCost() {
      if (!selectedProvince) {
        shippingCost = 0;
        return;
      }

      const zone = shippingZones.find(z => z.provincia === selectedProvince);
      if (zone) {
        shippingCost = zone.costoBase;

        const shippingInfo = document.getElementById('shippingInfo');
        const shippingDays = document.getElementById('shippingDays');
        const shippingCostSpan = document.getElementById('shippingCost');

        shippingDays.textContent = `⏱️ Entrega: ${zone.diasEntrega} días`;
        shippingCostSpan.textContent = `$${zone.costoBase.toLocaleString('es-AR')}`;
        shippingInfo.style.display = 'block';
      }
    }

    // RENDER PRODUCTS
    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      const noProducts = document.getElementById('noProducts');
      const search = document.getElementById('searchInput').value.toLowerCase();

      const filtered = products.filter(p => {
        const matchFilter = currentFilter === 'all' || p.category === currentFilter;
        const matchSearch = p.name.toLowerCase().includes(search) || p.brand.toLowerCase().includes(search);
        return matchFilter && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        noProducts.style.display = 'block';
        return;
      }

      noProducts.style.display = 'none';
      grid.innerHTML = filtered.map(p => {
        const inCart = cart.find(item => item.id === p.id);
        return `
          <div class="product-card">
            <div class="product-image">
              <img src="${p.image}" alt="${p.name}">
            </div>
            <div class="product-info">
              <div class="product-brand">${p.brand}</div>
              <div class="product-name">${p.name}</div>
              <div class="product-rating">★★★★★ (${p.reviews})</div>
              <div class="product-prices">
                <span class="price-usd">u$s ${p.priceUSD}</span>
                <span class="price-ars">$${(p.priceUSD * ARS_RATE).toLocaleString('es-AR')}</span>
              </div>
              <button class="add-to-cart-btn ${inCart ? 'in-cart' : ''}" onclick="toggleCart('${p.id}')">
                ${inCart ? '✓ EN CARRITO' : 'AGREGAR'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // CART FUNCTIONS
    function toggleCart(productId) {
      const product = products.find(p => p.id === productId);
      const existingItem = cart.find(item => item.id === productId);

      if (existingItem) {
        existingItem.quantity++;
      } else {
        cart.push({ ...product, quantity: 1 });
      }

      analytics.trackAddToCart(product, existingItem ? existingItem.quantity : 1);
      saveCart();
      renderProducts();
      updateCartCount();
    }

    function updateQuantity(productId, change) {
      const item = cart.find(p => p.id === productId);
      if (item) {
        item.quantity += change;
        if (item.quantity <= 0) {
          cart = cart.filter(p => p.id !== productId);
        }
      }
      saveCart();
      updateCartModal();
      updateCartCount();
      renderProducts();
    }

    function removeFromCart(productId) {
      cart = cart.filter(p => p.id !== productId);
      saveCart();
      updateCartModal();
      updateCartCount();
      renderProducts();
    }

    function saveCart() {
      localStorage.setItem('cart', JSON.stringify(cart));
    }

    function updateCartCount() {
      const count = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.getElementById('cartCount').textContent = count;
    }

    // UPDATE CART MODAL
    function updateCartModal() {
      const cartItems = document.getElementById('cartItems');
      const subtotalUSD = document.getElementById('subtotalUSD');
      const subtotalARS = document.getElementById('subtotalARS');
      const totalUSD = document.getElementById('totalUSD');
      const shippingSection = document.getElementById('shippingSection');
      const paymentSection = document.getElementById('paymentSection');
      const shippingRow = document.getElementById('shippingRow');
      const shippingDisplay = document.getElementById('shippingDisplay');

      if (cart.length === 0) {
        cartItems.innerHTML = '<div class="empty-cart">Tu carrito está vacío</div>';
        subtotalUSD.textContent = 'u$s 0';
        subtotalARS.textContent = '$0';
        totalUSD.textContent = 'u$s 0';
        shippingSection.style.display = 'none';
        paymentSection.style.display = 'none';
        shippingRow.style.display = 'none';
        return;
      }

      shippingSection.style.display = 'block';
      paymentSection.style.display = 'block';

      const total = cart.reduce((sum, item) => sum + (item.priceUSD * item.quantity), 0);
      const totalARS = total * ARS_RATE;
      const totalWithShipping = totalARS + shippingCost;

      cartItems.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div class="cart-item-info">
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-price">u$s ${item.priceUSD}</div>
          </div>
          <div class="cart-item-controls">
            <button class="qty-btn" onclick="updateQuantity('${item.id}', -1)">−</button>
            <span class="qty-display">${item.quantity}</span>
            <button class="qty-btn" onclick="updateQuantity('${item.id}', 1)">+</button>
            <button class="remove-btn" onclick="removeFromCart('${item.id}')">✕</button>
          </div>
        </div>
      `).join('');

      subtotalUSD.textContent = `u$s ${total.toFixed(2)}`;
      subtotalARS.textContent = `$${totalARS.toLocaleString('es-AR')}`;

      if (selectedProvince) {
        shippingRow.style.display = 'flex';
        shippingDisplay.textContent = `$${shippingCost.toLocaleString('es-AR')}`;
        totalUSD.textContent = `$${totalWithShipping.toLocaleString('es-AR')}`;
      } else {
        shippingRow.style.display = 'none';
        totalUSD.textContent = `u$s ${total.toFixed(2)}`;
      }
    }

    // PAYMENT METHOD SELECTION
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('.payment-option').forEach(btn => {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.payment-option').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          paymentMethod = this.dataset.method;

          const checkoutBtn = document.getElementById('checkoutBtn');
          const mercadoPagoBtn = document.getElementById('mercadoPagoBtn');
          const mpContainer = document.getElementById('mercadoPagoContainer');

          if (paymentMethod === 'whatsapp') {
            checkoutBtn.style.display = 'block';
            mercadoPagoBtn.style.display = 'none';
            mpContainer.style.display = 'none';
          } else {
            checkoutBtn.style.display = 'none';
            mercadoPagoBtn.style.display = 'block';
            mpContainer.style.display = 'block';
            createMercadoPagoPreference();
          }
        });
      });
    });

    // CREATE MERCADO PAGO PREFERENCE
    async function createMercadoPagoPreference() {
      if (!mp || cart.length === 0) return;

      try {
        const total = cart.reduce((sum, item) => sum + (item.priceUSD * item.quantity), 0);
        const totalARS = Math.round(total * ARS_RATE);

        const items = cart.map(item => ({
          title: item.name,
          unit_price: Math.round(item.priceUSD * ARS_RATE),
          quantity: item.quantity,
          currency_id: 'ARS'
        }));

        const body = {
          items: items,
          payer: {
            email: 'customer@kbeautycde.com'
          },
          back_urls: {
            success: window.location.origin + '/success.html',
            failure: window.location.origin + '/failure.html',
            pending: window.location.origin + '/pending.html'
          },
          external_reference: `order_${Date.now()}`,
          auto_return: 'approved'
        };

        const response = await fetch('https://api.mercadopago.com/checkout/preferences', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${config.mercadoPago?.accessToken || 'APP_USR-token'}`
          },
          body: JSON.stringify(body)
        });

        if (response.ok) {
          const preference = await response.json();
          preferenceId = preference.id;

          mp.checkout({
            preference: {
              id: preferenceId
            },
            render: 'walletmp',
            label: 'Pagar'
          });
        }
      } catch (error) {
        console.error('Error creating MP preference:', error);
        const mpError = document.getElementById('mpError');
        mpError.textContent = 'Error al cargar Mercado Pago. Intenta nuevamente.';
        mpError.style.display = 'block';
      }
    }

    // EVENT LISTENERS
    document.getElementById('cartBtn').addEventListener('click', () => {
      updateCartModal();
      document.getElementById('cartModal').classList.add('active');
    });

    document.getElementById('closeCart').addEventListener('click', () => {
      document.getElementById('cartModal').classList.remove('active');
    });

    document.getElementById('cartModal').addEventListener('click', (e) => {
      if (e.target.id === 'cartModal') {
        document.getElementById('cartModal').classList.remove('active');
      }
    });

    document.getElementById('searchInput').addEventListener('input', function() {
      const searchTerm = this.value.toLowerCase();
      const results = products.filter(p => p.name.toLowerCase().includes(searchTerm) || p.brand.toLowerCase().includes(searchTerm));
      if (searchTerm) {
        analytics.trackSearch(searchTerm, results.length);
      }
      renderProducts();
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentFilter = this.dataset.filter;
        analytics.trackFilter('category', currentFilter);
        renderProducts();
      });
    });

    // CHECKOUT - WhatsApp
    document.getElementById('checkoutBtn').addEventListener('click', () => {
      if (cart.length === 0) return;

      const total = cart.reduce((sum, item) => sum + (item.priceUSD * item.quantity), 0);
      const totalARS = (total * ARS_RATE).toLocaleString('es-AR');

      let shippingText = '';
      if (selectedProvince) {
        shippingText = `\n\nProvincia: ${selectedProvince}\nEnvío: $${shippingCost.toLocaleString('es-AR')}`;
      }

      const message = `
Hola! Quiero comprar los siguientes productos:

${cart.map(item => `• ${item.name} x${item.quantity} - u$s ${(item.priceUSD * item.quantity).toFixed(2)}`).join('\n')}

TOTAL: u$s ${total.toFixed(2)} | $ ${totalARS}${shippingText}

¿Cuál es el próximo paso?
      `.trim();

      analytics.trackWhatsAppClick(total);
      window.open(getWhatsAppURL(message), '_blank');
    });

    // CHECKOUT - Mercado Pago
    document.getElementById('mercadoPagoBtn').addEventListener('click', () => {
      if (!preferenceId) {
        alert('Por favor, espera a que cargue Mercado Pago');
        return;
      }

      // The wallet is already rendered, clicking this just confirms
      const wallet = document.querySelector('.walletmp-container');
      if (wallet) {
        wallet.click();
      }
    });

    // INIT
    loadData();
  </script>
</body>
</html>
