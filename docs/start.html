<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-Beauty CDE - Inicio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5e6e8 0%, #fffaf7 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 600px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      padding: 40px;
      text-align: center;
    }

    h1 {
      color: #c89080;
      font-size: 32px;
      margin-bottom: 20px;
    }

    .status-box {
      background: #f9f9f9;
      border-left: 4px solid #c89080;
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
      text-align: left;
    }

    .status-item {
      margin: 10px 0;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
    }

    .status-item.ok {
      background: #e8f5e9;
      color: #2e7d32;
      border-left: 3px solid #4caf50;
    }

    .status-item.pending {
      background: #fff3e0;
      color: #e65100;
      border-left: 3px solid #ff9800;
    }

    .status-item.error {
      background: #ffebee;
      color: #c62828;
      border-left: 3px solid #f44336;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 30px;
    }

    button, a.btn {
      padding: 15px 30px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #c89080 0%, #b8818b 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(200, 144, 128, 0.4);
    }

    .btn-secondary {
      background: #e0e0e0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #d0d0d0;
    }

    .info {
      font-size: 12px;
      color: #999;
      margin-top: 10px;
      line-height: 1.6;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(200, 144, 128, 0.3);
      border-top: 2px solid #c89080;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✨ K-Beauty CDE</h1>
    <p style="color: #999; margin-bottom: 20px;">Sistema de Verificación Automático</p>

    <div class="status-box">
      <div class="status-item pending" id="statusRepo">
        <span class="spinner"></span> Verificando repositorio...
      </div>
      <div class="status-item pending" id="statusConfig">
        <span class="spinner"></span> Verificando configuración local...
      </div>
      <div class="status-item pending" id="statusProducts">
        <span class="spinner"></span> Verificando productos...
      </div>
      <div class="status-item pending" id="statusDeploy">
        <span class="spinner"></span> Verificando despliegue...
      </div>
    </div>

    <div class="button-group" id="actions">
      <button class="btn-primary" onclick="goToShop()">
        🛍️ Ir a la Tienda
      </button>
      <button class="btn-secondary" onclick="goToConfig()">
        ⚙️ Configurar Supabase (Opcional)
      </button>
    </div>

    <div class="info">
      <p><strong>Estado del Sistema:</strong></p>
      <p id="systemStatus">Cargando información...</p>
    </div>
  </div>

  <script>
    // Detectar automáticamente el estado del sistema
    async function checkSystem() {
      // 1. Verificar repositorio (basado en el CNAME)
      try {
        const cnameResponse = await fetch('/CNAME');
        if (cnameResponse.ok) {
          const domain = await cnameResponse.text();
          updateStatus('statusRepo', 'ok', '✓ Dominio configurado: ' + domain.trim());
        }
      } catch (e) {
        updateStatus('statusRepo', 'error', '✗ Error verificando dominio');
      }

      // 2. Verificar configuración local (localStorage)
      const hasConfig = localStorage.getItem('SUPABASE_ANON_KEY') &&
                        localStorage.getItem('SUPABASE_SERVICE_KEY');

      if (hasConfig) {
        updateStatus('statusConfig', 'ok', '✓ Supabase configurado');
      } else {
        updateStatus('statusConfig', 'pending', '⚪ Supabase no configurado (opcional)');
      }

      // 3. Verificar productos
      try {
        const productsResponse = await fetch('./data/products.json');
        if (productsResponse.ok) {
          const products = await productsResponse.json();
          updateStatus('statusProducts', 'ok',
            '✓ ' + products.length + ' productos cargados');
        }
      } catch (e) {
        updateStatus('statusProducts', 'error', '✗ Error cargando productos');
      }

      // 4. Detectar dominio actual
      const currentHost = window.location.hostname;
      const isGitHubPages = currentHost.includes('github.io');
      const isCustomDomain = currentHost === 'kbeautycde.com';

      if (isCustomDomain) {
        updateStatus('statusDeploy', 'ok',
          '✓ Sitio en vivo: ' + currentHost);
      } else if (isGitHubPages) {
        updateStatus('statusDeploy', 'ok',
          '✓ Despliegue automático activo (GitHub Pages)');
      } else {
        updateStatus('statusDeploy', 'ok',
          '✓ Sitio accesible desde: ' + currentHost);
      }

      // Mostrar resumen
      const summary = isCustomDomain
        ? '🎉 Tu tienda está ACTIVA en kbeautycde.com'
        : '🚀 Sistema listo. DNS apuntando a GitHub Pages';

      document.getElementById('systemStatus').innerHTML = summary;
    }

    function updateStatus(elementId, status, message) {
      const element = document.getElementById(elementId);
      if (element) {
        element.className = 'status-item ' + status;
        element.innerHTML = message.replace('✓', '✓ ').replace('✗', '✗ ').replace('⚪', '⚪ ');
      }
    }

    function goToShop() {
      window.location.href = '/tienda-simple.html';
    }

    function goToConfig() {
      window.location.href = '/config.html';
    }

    // Ejecutar verificación al cargar
    window.addEventListener('load', checkSystem);

    // Actualizar cada 10 segundos
    setInterval(checkSystem, 10000);
  </script>
</body>
</html>
