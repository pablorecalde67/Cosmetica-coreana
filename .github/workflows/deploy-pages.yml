name: Deploy Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Descargar artefactos de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
