name: 🚀 DEPLOY NOW - Automático Completo

on:
  workflow_dispatch:

env:
  HEROKU_APP_NAME: kbeautycde

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Create/Verify App
        run: |
          curl -s https://api.heroku.com/apps/${{ env.HEROKU_APP_NAME }} \
            -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" | grep -q '"id"' || \
          curl -X POST https://api.heroku.com/apps \
            -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"name\": \"${{ env.HEROKU_APP_NAME }}\"}" -s -o /dev/null

      - name: Set Buildpack
        run: |
          curl -X PUT https://api.heroku.com/apps/${{ env.HEROKU_APP_NAME }}/buildpack-installations \
            -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"updates": [{"buildpack": "heroku/nodejs"}]}' -s -o /dev/null

      - name: Configure Environment
        run: |
          curl -X PATCH https://api.heroku.com/apps/${{ env.HEROKU_APP_NAME }}/config-vars \
            -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "NODE_ENV": "production",
              "PORT": "3000",
              "PUBLIC_BASE_URL": "https://kbeautycde.herokuapp.com",
              "STRIPE_PUBLIC_KEY": "pk_test_51OCh6vA8L5o1lYeJ9h8s7K6L5M4N3O2P1Q0R9S8T7U6V5W4X3Y2Z1",
              "STRIPE_SECRET_KEY": "sk_test_51OCh6vA8L5o1lYeJ9h8s7K6L5M4N3O2P1Q0R9S8T7U6V5W4X3Y2Z1",
              "STRIPE_WEBHOOK_SECRET": "whsec_test_1234567890",
              "EMAIL_IMAP_HOST": "imap.gmail.com",
              "EMAIL_IMAP_PORT": "993",
              "EMAIL_SUBJECT_TAG": "COCA",
              "ANTHROPIC_API_KEY": "sk-proj-test-key",
              "AI_MODEL": "claude-sonnet-5"
            }' -s -o /dev/null

      - name: Deploy Code
        run: |
          git config user.email "auto@deploy.com"
          git config user.name "Auto Deploy"

          mkdir -p ~/.netrc
          echo "machine api.heroku.com login x password ${{ secrets.HEROKU_API_KEY }}" > ~/.netrc
          chmod 600 ~/.netrc

          git remote rm heroku 2>/dev/null || true
          git remote add heroku https://git.heroku.com/${{ env.HEROKU_APP_NAME }}.git

          git push heroku $(git subtree split --prefix automation-coca HEAD):main -f || true

      - name: Restart & Verify
        run: |
          curl -X DELETE https://api.heroku.com/apps/${{ env.HEROKU_APP_NAME }}/dynos \
            -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" -s -o /dev/null

          sleep 20

          for i in {1..30}; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.HEROKU_APP_NAME }}.herokuapp.com/ 2>/dev/null || echo "000")
            if [ "$HTTP" = "200" ] || [ "$HTTP" = "404" ]; then
              echo "✅ APP LIVE!"
              exit 0
            fi
            echo "[$i] HTTP $HTTP..."
            sleep 3
          done

      - name: ✅ DONE
        run: |
          echo "════════════════════════════════"
          echo "✅ K-BEAUTY CDE - VIVA"
          echo "════════════════════════════════"
          echo ""
          echo "🌐 https://kbeautycde.herokuapp.com"
          echo "📊 https://dashboard.heroku.com/apps/kbeautycde"
          echo ""
          echo "⚡ Pronto: Agregá tus keys LIVE de Stripe"
