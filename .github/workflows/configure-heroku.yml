name: ⚡ Configure Heroku NOW

on:
  workflow_dispatch:
    inputs:
      stripe_secret_key:
        description: 'STRIPE SECRET KEY (sk_live_...) - REQUIRED'
        required: true
        type: string
      stripe_public_key:
        description: 'Stripe Public Key (pk_live_...)'
        required: false
        type: string
      stripe_webhook_secret:
        description: 'Stripe Webhook Secret (whsec_...)'
        required: false
        type: string
      paypal_secret:
        description: 'PayPal Secret (opcional)'
        required: false
        type: string
      email_user:
        description: 'Email/Gmail (opcional)'
        required: false
        type: string
      email_app_password:
        description: 'Gmail App Password (opcional)'
        required: false
        type: string
      anthropic_key:
        description: 'Anthropic API Key (opcional)'
        required: false
        type: string

env:
  HEROKU_APP_NAME: kbeautycde

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Heroku API Key
        run: |
          if [ -z "${{ secrets.HEROKU_API_KEY }}" ]; then
            echo "❌ ERROR: HEROKU_API_KEY not found in GitHub Secrets"
            exit 1
          fi
          echo "✅ HEROKU_API_KEY configured"

      - name: Build config vars JSON
        id: config
        run: |
          CONFIG='{
            "NODE_ENV": "production",
            "PORT": "3000",
            "PUBLIC_BASE_URL": "https://kbeautycde.herokuapp.com",
            "STRIPE_SECRET_KEY": "${{ inputs.stripe_secret_key }}",
            "AI_MODEL": "claude-sonnet-5"'

          [ -n "${{ inputs.stripe_public_key }}" ] && CONFIG="$CONFIG, \"STRIPE_PUBLIC_KEY\": \"${{ inputs.stripe_public_key }}\""
          [ -n "${{ inputs.stripe_webhook_secret }}" ] && CONFIG="$CONFIG, \"STRIPE_WEBHOOK_SECRET\": \"${{ inputs.stripe_webhook_secret }}\""
          [ -n "${{ inputs.paypal_secret }}" ] && CONFIG="$CONFIG, \"PAYPAL_CLIENT_SECRET\": \"${{ inputs.paypal_secret }}\""
          [ -n "${{ inputs.email_user }}" ] && CONFIG="$CONFIG, \"EMAIL_USER\": \"${{ inputs.email_user }}\""
          [ -n "${{ inputs.email_app_password }}" ] && CONFIG="$CONFIG, \"EMAIL_APP_PASSWORD\": \"${{ inputs.email_app_password }}\""
          [ -n "${{ inputs.anthropic_key }}" ] && CONFIG="$CONFIG, \"ANTHROPIC_API_KEY\": \"${{ inputs.anthropic_key }}\""

          CONFIG="$CONFIG}"
          echo "config=$CONFIG" >> $GITHUB_OUTPUT

      - name: Apply to Heroku
        run: |
          curl -X PATCH https://api.heroku.com/apps/${{ env.HEROKU_APP_NAME }}/config-vars \
            -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '${{ steps.config.outputs.config }}' \
            -s -o /tmp/response.json -w "HTTP %{http_code}\n"

          cat /tmp/response.json | jq '.' || cat /tmp/response.json
          echo "✅ Applied"

      - name: Restart y Verificar
        run: |
          echo "🔄 Restart..."
          curl -X DELETE https://api.heroku.com/apps/${{ env.HEROKU_APP_NAME }}/dynos \
            -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" -s -o /dev/null

          echo "⏳ Esperando 2-3 min..."
          sleep 20

          for i in {1..25}; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.HEROKU_APP_NAME }}.herokuapp.com/ 2>/dev/null || echo "000")
            if [ "$HTTP" = "200" ] || [ "$HTTP" = "404" ]; then
              echo "✅ ¡VIVA EN PRODUCCIÓN! (HTTP $HTTP)"
              exit 0
            fi
            echo "  [$i] ${HTTP}..."
            sleep 3
          done

      - name: ✅ LISTO
        run: |
          echo "════════════════════════════════════════"
          echo "✅ K-BEAUTY CDE - CONFIGURADO Y VIVO"
          echo "════════════════════════════════════════"
          echo "🌐 https://kbeautycde.herokuapp.com"
          echo "📊 https://dashboard.heroku.com/apps/kbeautycde"
