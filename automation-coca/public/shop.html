<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-Beauty CDE Shop - Catálogo Completo</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-pink: #e8b4a8;
      --accent-dark: #c89080;
      --text-dark: #2c2c2c;
      --bg-light: #fffaf7;
      --bg-card: #faf6f3;
      --border-color: #e8d5c8;
      --success: #4caf50;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg-light);
      color: var(--text-dark);
      line-height: 1.6;
    }

    /* HEADER */
    header {
      background: white;
      padding: 15px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-img {
      width: 40px;
      height: 40px;
    }

    .header-title {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      color: var(--accent-dark);
      flex: 1;
      text-align: center;
    }

    .cart-btn {
      background: var(--accent-dark);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      position: relative;
      transition: all 0.3s ease;
    }

    .cart-btn:hover {
      background: var(--primary-pink);
      transform: scale(1.05);
    }

    .cart-count {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #ff6b6b;
      color: white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }

    /* FILTERS & SEARCH */
    .controls {
      background: white;
      padding: 15px;
      margin: 10px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      padding: 10px 15px;
      border: 2px solid var(--primary-pink);
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Montserrat', sans-serif;
    }

    .search-box:focus {
      outline: none;
      border-color: var(--accent-dark);
      background: #fef9f6;
    }

    .filter-btn {
      padding: 8px 15px;
      background: var(--bg-card);
      border: 2px solid var(--primary-pink);
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.3s ease;
      color: var(--text-dark);
    }

    .filter-btn.active {
      background: var(--accent-dark);
      color: white;
      border-color: var(--accent-dark);
    }

    .filter-btn:hover {
      background: var(--primary-pink);
      color: white;
      border-color: var(--primary-pink);
    }

    /* PRODUCTS GRID */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
      margin-bottom: 40px;
    }

    .product-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(200, 144, 128, 0.08);
      transition: all 0.3s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 8px 20px rgba(200, 144, 128, 0.15);
    }

    .product-image {
      width: 100%;
      height: 160px;
      background: linear-gradient(135deg, #fffaf7 0%, #f9f5f1 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 12px 12px 0 0;
    }

    .product-image img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    .product-info {
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .product-brand {
      font-size: 11px;
      color: var(--accent-dark);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .product-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dark);
      margin: 5px 0;
      line-height: 1.4;
      flex: 1;
    }

    .product-rating {
      font-size: 11px;
      color: #ffc107;
      margin-bottom: 8px;
    }

    .product-prices {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .price-usd {
      font-size: 13px;
      color: var(--primary-pink);
    }

    .price-ars {
      font-size: 11px;
      color: var(--accent-dark);
    }

    .add-to-cart-btn {
      width: 100%;
      padding: 8px;
      background: var(--primary-pink);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .add-to-cart-btn:hover {
      background: var(--accent-dark);
      transform: scale(1.02);
    }

    .add-to-cart-btn.in-cart {
      background: var(--success);
    }

    .no-products {
      text-align: center;
      padding: 40px 20px;
      color: var(--accent-dark);
      font-size: 16px;
    }

    /* CART MODAL */
    .cart-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      overflow-y: auto;
    }

    .cart-modal.active {
      display: flex;
      align-items: flex-end;
    }

    .cart-content {
      background: white;
      width: 100%;
      max-width: 500px;
      margin-left: auto;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      max-height: 80vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }
      to {
        transform: translateY(0);
      }
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 15px;
    }

    .cart-header h2 {
      font-family: 'Playfair Display', serif;
      color: var(--accent-dark);
    }

    .close-cart {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--text-dark);
    }

    .cart-items {
      margin-bottom: 20px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-name {
      font-weight: 600;
      font-size: 14px;
      color: var(--text-dark);
    }

    .cart-item-price {
      font-size: 13px;
      color: var(--primary-pink);
      margin-top: 5px;
    }

    .cart-item-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty-btn {
      width: 24px;
      height: 24px;
      border: 1px solid var(--primary-pink);
      background: white;
      color: var(--primary-pink);
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .qty-btn:hover {
      background: var(--primary-pink);
      color: white;
    }

    .qty-display {
      width: 30px;
      text-align: center;
      font-weight: 600;
    }

    .remove-btn {
      background: none;
      border: none;
      color: #ff6b6b;
      cursor: pointer;
      font-size: 18px;
    }

    .cart-summary {
      background: var(--bg-card);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .summary-row.total {
      font-weight: 700;
      font-size: 16px;
      color: var(--accent-dark);
      border-top: 2px solid var(--border-color);
      padding-top: 10px;
      margin-top: 10px;
    }

    .checkout-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent-dark);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .checkout-btn:hover {
      background: var(--primary-pink);
      transform: scale(1.02);
    }

    .empty-cart {
      text-align: center;
      padding: 40px 20px;
      color: var(--accent-dark);
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .products-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
      }

      .controls {
        flex-direction: column;
      }

      .search-box {
        min-width: 100%;
      }

      .header-title {
        font-size: 16px;
      }
    }

    @media (max-width: 480px) {
      .products-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .cart-content {
        max-width: 100%;
      }

      .product-image {
        height: 140px;
      }

      .product-name {
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header>
    <img src="./logo.svg" alt="K-Beauty CDE" class="logo-img">
    <h1 class="header-title">K-BEAUTY SHOP</h1>
    <button class="cart-btn" id="cartBtn">
      CARRITO
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </header>

  <div class="container">
    <!-- SEARCH & FILTERS -->
    <div class="controls">
      <input type="text" id="searchInput" class="search-box" placeholder="Buscar producto...">
      <button class="filter-btn active" data-filter="all">TODOS</button>
      <button class="filter-btn" data-filter="serum">SERUMS</button>
      <button class="filter-btn" data-filter="toner">TÓNICOS</button>
      <button class="filter-btn" data-filter="cream">CREMAS</button>
      <button class="filter-btn" data-filter="cleanser">LIMPIADORAS</button>
      <button class="filter-btn" data-filter="sunscreen">PROTECTORES</button>
      <button class="filter-btn" data-filter="ampoule">AMPOLLAS</button>
    </div>

    <!-- PRODUCTS GRID -->
    <div class="products-grid" id="productsGrid"></div>
    <div class="no-products" id="noProducts" style="display: none;">
      No se encontraron productos
    </div>
  </div>

  <!-- CART MODAL -->
  <div class="cart-modal" id="cartModal">
    <div class="cart-content">
      <div class="cart-header">
        <h2>Mi Carrito</h2>
        <button class="close-cart" id="closeCart">&times;</button>
      </div>
      <div class="cart-items" id="cartItems"></div>
      <div class="cart-summary">
        <div class="summary-row">
          <span>Subtotal USD:</span>
          <span id="subtotalUSD">u$s 0</span>
        </div>
        <div class="summary-row">
          <span>Subtotal ARS:</span>
          <span id="subtotalARS">$0</span>
        </div>
        <div class="summary-row total">
          <span>Total:</span>
          <span id="totalUSD">u$s 0</span>
        </div>
      </div>
      <button class="checkout-btn" id="checkoutBtn">COMPRAR POR WHATSAPP</button>
    </div>
  </div>

  <script src="./config.js"></script>
  <script src="./analytics.js"></script>
  <script>
    const ARS_RATE = 1050;
    let products = [];
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let currentFilter = 'all';

    // LOAD PRODUCTS
    async function loadProducts() {
      try {
        const response = await fetch('./data/products.json');
        products = await response.json();
        analytics.trackPageView('Shop - Catálogo Completo');
        renderProducts();
        updateCartCount();
      } catch (error) {
        console.error('Error loading products:', error);
        document.getElementById('noProducts').style.display = 'block';
      }
    }

    // RENDER PRODUCTS
    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      const noProducts = document.getElementById('noProducts');
      const search = document.getElementById('searchInput').value.toLowerCase();

      const filtered = products.filter(p => {
        const matchFilter = currentFilter === 'all' || p.category === currentFilter;
        const matchSearch = p.name.toLowerCase().includes(search) || p.brand.toLowerCase().includes(search);
        return matchFilter && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        noProducts.style.display = 'block';
        return;
      }

      noProducts.style.display = 'none';
      grid.innerHTML = filtered.map(p => {
        const inCart = cart.find(item => item.id === p.id);
        return `
          <div class="product-card">
            <div class="product-image">
              <img src="${p.image}" alt="${p.name}">
            </div>
            <div class="product-info">
              <div class="product-brand">${p.brand}</div>
              <div class="product-name">${p.name}</div>
              <div class="product-rating">★★★★★ (${p.reviews})</div>
              <div class="product-prices">
                <span class="price-usd">u$s ${p.priceUSD}</span>
                <span class="price-ars">$${(p.priceUSD * ARS_RATE).toLocaleString('es-AR')}</span>
              </div>
              <button class="add-to-cart-btn ${inCart ? 'in-cart' : ''}" onclick="toggleCart('${p.id}')">
                ${inCart ? '✓ EN CARRITO' : 'AGREGAR'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // CART FUNCTIONS
    function toggleCart(productId) {
      const product = products.find(p => p.id === productId);
      const existingItem = cart.find(item => item.id === productId);

      if (existingItem) {
        existingItem.quantity++;
      } else {
        cart.push({ ...product, quantity: 1 });
      }

      analytics.trackAddToCart(product, existingItem ? existingItem.quantity : 1);
      saveCart();
      renderProducts();
      updateCartCount();
    }

    function updateQuantity(productId, change) {
      const item = cart.find(p => p.id === productId);
      if (item) {
        item.quantity += change;
        if (item.quantity <= 0) {
          cart = cart.filter(p => p.id !== productId);
        }
      }
      saveCart();
      renderCartModal();
      updateCartCount();
      renderProducts();
    }

    function removeFromCart(productId) {
      cart = cart.filter(p => p.id !== productId);
      saveCart();
      renderCartModal();
      updateCartCount();
      renderProducts();
    }

    function saveCart() {
      localStorage.setItem('cart', JSON.stringify(cart));
    }

    function updateCartCount() {
      const count = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.getElementById('cartCount').textContent = count;
    }

    // CART MODAL
    function renderCartModal() {
      const cartItems = document.getElementById('cartItems');
      const subtotalUSD = document.getElementById('subtotalUSD');
      const subtotalARS = document.getElementById('subtotalARS');
      const totalUSD = document.getElementById('totalUSD');

      if (cart.length === 0) {
        cartItems.innerHTML = '<div class="empty-cart">Tu carrito está vacío</div>';
        subtotalUSD.textContent = 'u$s 0';
        subtotalARS.textContent = '$0';
        totalUSD.textContent = 'u$s 0';
        return;
      }

      const total = cart.reduce((sum, item) => sum + (item.priceUSD * item.quantity), 0);
      const totalARS = total * ARS_RATE;

      cartItems.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div class="cart-item-info">
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-price">u$s ${item.priceUSD}</div>
          </div>
          <div class="cart-item-controls">
            <button class="qty-btn" onclick="updateQuantity('${item.id}', -1)">−</button>
            <span class="qty-display">${item.quantity}</span>
            <button class="qty-btn" onclick="updateQuantity('${item.id}', 1)">+</button>
            <button class="remove-btn" onclick="removeFromCart('${item.id}')">✕</button>
          </div>
        </div>
      `).join('');

      subtotalUSD.textContent = `u$s ${total.toFixed(2)}`;
      subtotalARS.textContent = `$${totalARS.toLocaleString('es-AR')}`;
      totalUSD.textContent = `u$s ${total.toFixed(2)}`;
    }

    // EVENT LISTENERS
    document.getElementById('cartBtn').addEventListener('click', () => {
      renderCartModal();
      document.getElementById('cartModal').classList.add('active');
    });

    document.getElementById('closeCart').addEventListener('click', () => {
      document.getElementById('cartModal').classList.remove('active');
    });

    document.getElementById('cartModal').addEventListener('click', (e) => {
      if (e.target.id === 'cartModal') {
        document.getElementById('cartModal').classList.remove('active');
      }
    });

    document.getElementById('searchInput').addEventListener('input', function() {
      const searchTerm = this.value.toLowerCase();
      const results = products.filter(p => p.name.toLowerCase().includes(searchTerm) || p.brand.toLowerCase().includes(searchTerm));
      if (searchTerm) {
        analytics.trackSearch(searchTerm, results.length);
      }
      renderProducts();
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentFilter = this.dataset.filter;
        analytics.trackFilter('category', currentFilter);
        renderProducts();
      });
    });

    // CHECKOUT - WhatsApp
    document.getElementById('checkoutBtn').addEventListener('click', () => {
      if (cart.length === 0) return;

      const total = cart.reduce((sum, item) => sum + (item.priceUSD * item.quantity), 0);
      const totalARS = (total * ARS_RATE).toLocaleString('es-AR');

      const message = `
Hola! Quiero comprar los siguientes productos:

${cart.map(item => `• ${item.name} x${item.quantity} - u$s ${(item.priceUSD * item.quantity).toFixed(2)}`).join('\n')}

TOTAL: u$s ${total.toFixed(2)} | $ ${totalARS}

¿Cuál es el próximo paso?
      `.trim();

      analytics.trackWhatsAppClick(total);
      window.open(getWhatsAppURL(message), '_blank');
    });

    // INIT
    loadProducts();
  </script>
</body>
</html>
