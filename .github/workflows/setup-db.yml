name: Setup Database

on:
  workflow_dispatch:
    inputs:
      setup_only:
        description: 'Setup tables only (skip product loading)'
        required: false
        default: 'false'

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Run database setup
        env:
          SUPABASE_HOST: db.baddsoyjxthsldksinxo.supabase.co
          SUPABASE_USER: postgres
          SUPABASE_DB: postgres
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
        run: |
          python3 << 'EOF'
          import psycopg2
          import os
          from pathlib import Path

          host = os.getenv('SUPABASE_HOST')
          user = os.getenv('SUPABASE_USER')
          password = os.getenv('SUPABASE_PASSWORD')
          database = os.getenv('SUPABASE_DB')

          if not password:
            print("❌ ERROR: SUPABASE_PASSWORD secret not configured")
            print("   Go to: https://github.com/pablorecalde67/Cosmetica-coreana/settings/secrets/actions")
            print("   Add secret: SUPABASE_PASSWORD = your_supabase_password")
            exit(1)

          print(f"🔌 Conectando a {host}...")

          try:
            conn = psycopg2.connect(
              host=host,
              user=user,
              password=password,
              database=database,
              sslmode="require",
              connect_timeout=10
            )
            cursor = conn.cursor()
            print("✅ Conexión exitosa")

            # Execute SETUP_SUPABASE.sql
            print("\n📋 Creando tablas...")
            setup_sql_path = Path("SETUP_SUPABASE.sql")
            if setup_sql_path.exists():
              with open(setup_sql_path, 'r', encoding='utf-8') as f:
                sql_setup = f.read()

              # Execute in smaller chunks to avoid timeouts
              statements = [s.strip() for s in sql_setup.split(';') if s.strip()]
              for stmt in statements:
                try:
                  cursor.execute(stmt)
                except Exception as e:
                  # Some statements might fail if already exist - that's ok
                  if "already exists" not in str(e).lower():
                    print(f"   ⚠️  {str(e)[:100]}")

              conn.commit()
              print("✅ Tablas creadas/verificadas")

            # Execute LOAD_PRODUCTOS.sql
            print("\n📦 Cargando productos...")
            load_sql_path = Path("LOAD_PRODUCTOS.sql")
            if load_sql_path.exists():
              with open(load_sql_path, 'r', encoding='utf-8') as f:
                sql_load = f.read()

              statements = [s.strip() for s in sql_load.split(';') if s.strip()]
              for i, stmt in enumerate(statements):
                try:
                  cursor.execute(stmt)
                  if (i + 1) % 100 == 0:
                    print(f"   ✓ {i + 1}/{len(statements)} insertados")
                except Exception as e:
                  if "duplicate" not in str(e).lower():
                    print(f"   ⚠️  Error en inserción {i}: {str(e)[:80]}")

              conn.commit()
              print("✅ Productos cargados")

            # Verify
            print("\n📊 Verificando...")
            cursor.execute("SELECT COUNT(*) FROM productos;")
            count = cursor.fetchone()[0]
            print(f"   ✅ Productos en BD: {count}")

            cursor.execute("SELECT COUNT(*) FROM andreani_zonas;")
            zones = cursor.fetchone()[0]
            print(f"   ✅ Provincias: {zones}")

            cursor.close()
            conn.close()

            print("\n" + "="*60)
            print("✨ BASE DE DATOS CONFIGURADA EXITOSAMENTE")
            print("="*60)
            print("\nTu tienda está lista en:")
            print("  🌐 https://pablorecalde67.github.io/Cosmetica-coreana/")
            print("\nPanel administrativo:")
            print("  📊 https://pablorecalde67.github.io/Cosmetica-coreana/admin.html")

          except psycopg2.OperationalError as e:
            print(f"❌ Error de conexión: {str(e)}")
            print("\nVerifica que:")
            print("  1. El password sea correcto")
            print("  2. Tengas conexión a Internet")
            print("  3. El proyecto Supabase esté activo")
            exit(1)
          except Exception as e:
            print(f"❌ Error: {str(e)}")
            exit(1)
          EOF

      - name: Log success
        if: success()
        run: echo "✅ Database setup completed successfully"

      - name: Log failure
        if: failure()
        run: echo "❌ Database setup failed - check logs above"
