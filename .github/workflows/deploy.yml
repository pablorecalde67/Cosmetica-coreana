name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  HEROKU_APP_NAME: kbeautycde

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --only=production
        working-directory: automation-coca

      - name: Run tests
        run: node scripts/test-suite.js
        working-directory: automation-coca
        env:
          TEST_URL: http://localhost:3000
          ADMIN_TOKEN: test-token-123

  deploy-heroku:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Deploy to Heroku via git push
        run: |
          # Set up Heroku credentials
          mkdir -p ~/.netrc
          echo "machine api.heroku.com" > ~/.netrc
          echo "  login placeholder" >> ~/.netrc
          echo "  password $HEROKU_API_KEY" >> ~/.netrc
          chmod 600 ~/.netrc

          # Configure git
          git config user.email "ci@heroku.com"
          git config user.name "GitHub Actions"

          # Add Heroku remote
          git remote add heroku https://git.heroku.com/${{ env.HEROKU_APP_NAME }}.git

          # Deploy the automation-coca subdirectory
          git push heroku \`git subtree split --prefix automation-coca main\`:main -f 2>&1 | tee deploy.log

          echo "✅ Deployment initiated"
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}

      - name: Health check
        run: |
          sleep 20
          for i in {1..8}; do
            echo "Health check attempt $i/8..."
            if curl -s -f https://${{ env.HEROKU_APP_NAME }}.herokuapp.com/api/admin/health > /dev/null 2>&1; then
              echo "✅ App is running!"
              curl -s https://${{ env.HEROKU_APP_NAME }}.herokuapp.com/api/admin/health
              exit 0
            fi
            sleep 5
          done
          echo "⚠️  App might still be starting, but deployment completed"
          exit 0

  notify:
    needs: [test, deploy-heroku]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deployment status
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deployment successful!"
            echo "🌐 App: https://${{ env.HEROKU_APP_NAME }}.herokuapp.com"
            echo "📊 Admin: https://${{ env.HEROKU_APP_NAME }}.herokuapp.com/admin.html"
          else
            echo "⚠️  Deployment had issues"
          fi
