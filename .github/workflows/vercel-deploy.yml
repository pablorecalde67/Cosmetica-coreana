name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Install Vercel CLI
          npm install -g vercel

          # Create vercel.json if it doesn't exist
          [ -f vercel.json ] || echo '{"buildCommand":"npm install","outputDirectory":"."}' > vercel.json

          # Deploy using Vercel CLI with token
          vercel --prod --token "$VERCEL_TOKEN" --yes --confirm
        continue-on-error: true

      - name: Alternative: Direct deployment
        if: failure()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Attempting direct Vercel API deployment..."
          curl -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "cosmetica-coreana",
              "gitSource": {"type": "github", "repo": "pablorecalde67/Cosmetica-coreana", "ref": "main"}
            }' || echo "Direct deployment also failed - check Vercel dashboard"
