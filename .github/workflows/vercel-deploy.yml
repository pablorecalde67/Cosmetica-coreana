name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via Vercel API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Deploying to Vercel using API..."

          # Create deployment via Vercel API
          RESPONSE=$(curl -s -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "cosmetica-coreana",
              "gitSource": {
                "type": "github",
                "repo": "pablorecalde67/Cosmetica-coreana",
                "ref": "main"
              }
            }')

          echo "API Response:"
          echo "$RESPONSE" | head -50

          # Check response
          if echo "$RESPONSE" | grep -q '"id"'; then
            echo "✅ Deployment created successfully"
          else
            echo "⚠️ Check Vercel dashboard for deployment status"
          fi
